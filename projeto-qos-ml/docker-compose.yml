services:
  # 1. Banco de Dados
  mysql-server:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password --log-bin-trust-function-creators=1 --character-set-server=utf8mb4 --collation-server=utf8mb4_bin
    environment:
      MYSQL_ROOT_PASSWORD: mysql
      MYSQL_USER: zabbix
      MYSQL_PASSWORD: admin
      MYSQL_DATABASE: zabbix
    volumes:
      - ./zabbix_db_data:/var/lib/mysql
    ports:
      - "3307:3306"
    restart: always
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pmysql"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Servidor Zabbix (Motor de Coleta)
  zabbix-server:
    image: zabbix/zabbix-server-mysql:ubuntu-7.0-latest
    environment:
      DB_SERVER_HOST: mysql-server
      MYSQL_USER: zabbix
      MYSQL_PASSWORD: admin
      ZBX_CACHESIZE: 512M
    ports:
      - "10051:10051" # Porta que receberá as métricas do nosso script de Data Replay
    depends_on:
      mysql-server:
        condition: service_healthy
    restart: always

  # 3. Interface Web do Zabbix (Nginx)
  zabbix-web:
    image: zabbix/zabbix-web-nginx-mysql:ubuntu-7.0-latest
    environment:
      DB_SERVER_HOST: mysql-server
      MYSQL_USER: zabbix
      MYSQL_PASSWORD: admin
      ZBX_SERVER_HOST: zabbix-server
      PHP_TZ: America/Sao_Paulo
    ports:
      - "8081:8080" # Acesso ao painel web do Zabbix
    depends_on:
      - zabbix-server
      - mysql-server
    restart: always

  # 4. Grafana (Visualização)
  grafana:
    image: grafana/grafana:latest
    environment:
      GF_INSTALL_PLUGINS: alexanderzobnin-zabbix-app # Já instala o plugin do Zabbix automaticamente
    volumes:
      - ./grafana_data:/var/lib/grafana
    ports:
      - "3000:3000" # Acesso ao painel web do Grafana
    restart: always
